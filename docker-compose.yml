# Production stack on the VPS (/opt/duevy/app): the API plus Caddy, which
# terminates HTTPS for api.duevy.app and proxies to api:3000. Deployed by
# scripts/deploy.sh on every push to main.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  uploads:
  caddy_data:
